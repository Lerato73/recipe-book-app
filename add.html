<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Add Meal</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif }
html, body { height:100%; overflow:hidden; }
body { background:#F5F5F5; display:flex; justify-content:center; align-items:center; }
.phone{ width:100%; max-width:380px; height:100vh; max-height:680px; background:white; display:flex; flex-direction:column; overflow:hidden; border-radius:20px; box-shadow:0 0 20px rgba(0,0,0,0.08); }
.top{ background:#FF9B2F; padding:16px; flex-shrink:0; }
.top h2{font-size:18px;font-weight:900}
.top p{font-size:11px;margin:2px 0 10px;opacity:0.9}
.content{ flex:1; overflow-y:auto; background:#FAFAFA; scrollbar-width:none; -ms-overflow-style:none; padding:12px}
.content::-webkit-scrollbar{display:none; width:0; height:0}
.form-card{background:white;border-radius:16px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.upload{border:2px dashed #FFC727;background:#FFF7E0;border-radius:12px;padding:16px;text-align:center;font-size:11px;color:#888;margin-bottom:12px;cursor:pointer}
.form-card label{font-size:11px;font-weight:700;margin-top:10px;display:block}
.form-card input, .form-card select, .form-card textarea{width:100%;padding:10px;border-radius:12px;border:1px solid #ddd;margin-top:6px;font-size:12px;background:white}
.form-card textarea{height:70px;resize:none}
.row{display:flex;gap:8px}
.row div{flex:1}
.btn-yellow{width:100%;background:#FFC727;border:none;padding:12px;border-radius:14px;font-weight:800;margin-top:14px;cursor:pointer}
.nav{display:flex;justify-content:space-around;align-items:center;padding:10px 0;background:white;border-top:1px solid #eee;flex-shrink:0}
.nav a{text-decoration:none;text-align:center;font-size:9px;color:#888;line-height:12px}
.nav a.active{color:#111;font-weight:700}
.nav .plus{width:38px;height:38px;background:#FFC727;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;color:#111;font-weight:900}
</style>
</head>
<body>
<div class="phone">
  <div class="top">
    <h2>Recipe Book 🔍</h2>
    <p>What's cooking today?</p>
  </div>

  <div class="content">
    <div style="font-size:14px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:6px"><span style="width:26px;height:26px;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center">‹</span> Add New Recipe +</div>
    
    <div class="form-card">
      <div class="upload">📷<br>Tap to upload photo</div>
      
      <label>Recipe Name</label>
      <input id="name" placeholder="e.g. Creamy Garlic Pasta">

      <div class="row">
        <div>
          <label>Category</label>
          <select id="cat"><option>Seafood</option><option>Chicken</option><option>Beef</option><option>Dessert</option></select>
        </div>
        <div>
          <label>Cooking Time (min)</label>
          <input id="time" type="number" placeholder="30">
        </div>
      </div>

      <label>Ingredients (one per line)</label>
      <textarea id="ingredients" placeholder="2 cups flour&#10;1 tsp salt&#10;200g chicken"></textarea>

      <label>Instructions</label>
      <textarea id="instructions" placeholder="1. Boil pasta...&#10;2. Add sauce..."></textarea>

      <button class="btn-yellow" onclick="saveMeal()">Save Recipe</button>
    </div>
  </div>

  <div class="nav">
    <a href="index.html">🏠<br>Home</a>
    <a href="favorites.html">⭐<br>Fav</a>
    <a href="add.html" class="plus active">+</a>
    <a href="profile.html">👤<br>Prof</a>
    <a href="settings.html">⚙️<br>Set</a>
  </div>
</div>

<script>
function saveMeal(){
  const name=document.getElementById('name').value.trim();
  if(!name) return alert('Enter recipe name');
  const cat=document.getElementById('cat').value||'My Meal';
  const time=parseInt(document.getElementById('time').value)||20;
  const newM={idMeal:Date.now().toString(),strMeal:name,strCategory:cat,strMealThumb:`https://via.placeholder.com/300/FFC727/000?text=${encodeURIComponent(name)}`,time:time,isCustom:true};
  let custom=JSON.parse(localStorage.getItem('custom_meals')||'[]');
  custom.unshift(newM);
  localStorage.setItem('custom_meals', JSON.stringify(custom));
  alert('Saved!');
  window.location.href='index.html';
}
</script>
</body>
</html>
