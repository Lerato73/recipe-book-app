<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Recipe Book</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif }
html, body { height:100%; overflow:hidden; }
body { background:#F5F5F5; display:flex; justify-content:center; align-items:center; }
.phone{ width:100%; max-width:380px; height:100vh; max-height:680px; background:white; display:flex; flex-direction:column; overflow:hidden; border-radius:20px; box-shadow:0 0 20px rgba(0,0,0,0.08); }
.top{ background:#FF9B2F; padding:16px; flex-shrink:0; }
.top h2{font-size:18px;font-weight:900} .top p{font-size:11px;margin:2px 0 10px}
.search{background:white;border-radius:20px;display:flex;align-items:center;padding:9px 12px;gap:8px}
.search input{border:none;outline:none;width:100%;font-size:13px;background:transparent}
.filters{display:flex;gap:8px;margin-top:10px}
.filters select{flex:1;border:none;border-radius:16px;padding:8px 10px;font-size:11px;background:white;font-weight:600}
.content{ flex:1; overflow-y:auto; background:#FAFAFA; scrollbar-width:none; }
.content::-webkit-scrollbar{display:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.card{border-radius:16px;overflow:hidden;background:white;box-shadow:0 1px 4px rgba(0,0,0,.08);border:1px solid #f0f0f0}
.thumb{position:relative} .thumb img{width:100%;height:125px;object-fit:cover;display:block}
.badge{position:absolute;top:7px;left:7px;background:#111;color:#FFC727;font-size:7px;font-weight:800;padding:3px 6px;border-radius:8px}
.heart{position:absolute;top:7px;right:7px;width:26px;height:26px;border-radius:50%;background:white;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.heart.active{background:#FF4B3E}
.card h4{font-size:11px;font-weight:700;margin:7px 8px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;gap:4px;margin:0 8px 10px} .tags span{font-size:8px;padding:3px 6px;border-radius:10px;background:#F2F2F2} .tags .time{background:#FFF0B3}
.nav{display:flex;justify-content:space-around;align-items:center;padding:10px 0;background:white;border-top:1px solid #eee;flex-shrink:0}
.nav a{text-decoration:none;text-align:center;font-size:9px;color:#888;line-height:12px}
.nav a.active{color:#111;font-weight:700}
.nav .plus{width:38px;height:38px;background:#FFC727;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;color:#111;font-weight:900}
</style>
</head>
<body>
<div class="phone">
  <div class="top">
    <h2>Recipe Book 🔍</h2>
    <p>What's cooking today?</p>
    <div class="search"><span>🔍</span><input id="searchInput" type="text" placeholder="Search meals..." autocomplete="off"></div>
    <div class="filters">
      <select id="catSelect">
        <option value="all">Category - All</option>
        <option value="Chicken">Chicken</option>
        <option value="Beef">Beef</option>
        <option value="Dessert">Dessert</option>
      </select>
      <select id="timeSelect">
        <option value="">Cooking Time</option>
        <option value="20">Under 20m</option>
        <option value="35">Under 35m</option>
      </select>
    </div>
  </div>

  <div class="content">
    <div class="grid" id="mealGrid"></div>
  </div>

  <div class="nav">
    <a href="index.html" class="active">🏠<br>Home</a>
    <a href="favorites.html">⭐<br>Fav</a>
    <a href="add.html" class="plus">+</a>
    <a href="profile.html">👤<br>Prof</a>
    <a href="settings.html">⚙️<br>Set</a>
  </div>
</div>

<script>
// BACKUP MEALS - SHOW EVEN WITHOUT INTERNET
const backupMeals = [
  {idMeal:"1", strMeal:"Beef Pho", strCategory:"Beef", strMealThumb:"https://www.themealdb.com/images/media/meals/qqwypw1504642429.jpg", time:30, isCustom:false},
  {idMeal:"2", strMeal:"Chicken Curry", strCategory:"Chicken", strMealThumb:"https://www.themealdb.com/images/media/meals/wyxwsp1486979827.jpg", time:25, isCustom:false},
  {idMeal:"3", strMeal:"Beef Mandi", strCategory:"Beef", strMealThumb:"https://www.themealdb.com/images/media/meals/1525876468.jpg", time:45, isCustom:false},
  {idMeal:"4", strMeal:"Apple Frangipan", strCategory:"Dessert", strMealThumb:"https://www.themealdb.com/images/media/meals/wxywrq1468235067.jpg", time:20, isCustom:false},
  {idMeal:"5", strMeal:"Beef Bourguignon", strCategory:"Beef", strMealThumb:"https://www.themealdb.com/images/media/meals/vtqxtu1511784197.jpg", time:35, isCustom:false},
  {idMeal:"6", strMeal:"Chicken Biryani", strCategory:"Chicken", strMealThumb:"https://www.themealdb.com/images/media/meals/xrttsx1487339558.jpg", time:40, isCustom:false},
  {idMeal:"7", strMeal:"Chocolate Cake", strCategory:"Dessert", strMealThumb:"https://www.themealdb.com/images/media/meals/tqtywx1468317395.jpg", time:15, isCustom:false},
  {idMeal:"8", strMeal:"Grilled Beef", strCategory:"Beef", strMealThumb:"https://www.themealdb.com/images/media/meals/1529443236.jpg", time:25, isCustom:false}
];

let allMeals = [...backupMeals];
let favorites = JSON.parse(localStorage.getItem('recipe_favs') || '[]');
let customMeals = JSON.parse(localStorage.getItem('custom_meals') || '[]');
allMeals = [...customMeals, ...backupMeals];

function isFav(id){ return favorites.find(f=>f.idMeal===id); }

function render(meals){
  const cat = document.getElementById('catSelect').value;
  const timeLimit = document.getElementById('timeSelect').value;
  let filtered = meals;
  
  if(cat && cat !== "all"){
    filtered = filtered.filter(m=> m.strCategory.toLowerCase() === cat.toLowerCase());
  }
  if(timeLimit){
    filtered = filtered.filter(m=> m.time <= parseInt(timeLimit));
  }

  // SEARCH FILTER
  const q = document.getElementById('searchInput').value.toLowerCase();
  if(q){
    filtered = filtered.filter(m=> m.strMeal.toLowerCase().includes(q));
  }

  document.getElementById('mealGrid').innerHTML = filtered.map(m=>`
    <div class="card">
      <div class="thumb">
        <img src="${m.strMealThumb}">
        ${m.isCustom ? '<span class="badge">MY MEAL</span>' : ''}
        <button class="heart ${isFav(m.idMeal)?'active':''}" onclick="toggleFav('${m.idMeal}')">${isFav(m.idMeal)?'❤️':'🤍'}</button>
      </div>
      <h4>${m.strMeal}</h4>
      <div class="tags"><span>${m.strCategory}</span><span class="time">⏱ ${m.time}m</span></div>
    </div>
  `).join('');
}

function toggleFav(id){
  const meal = allMeals.find(m=>m.idMeal===id);
  if(isFav(id)){
    favorites = favorites.filter(f=>f.idMeal!==id);
  } else {
    favorites.push(meal);
  }
  localStorage.setItem('recipe_favs', JSON.stringify(favorites));
  render(allMeals);
}

// TRY API, BUT IF FAILS KEEP BACKUP
async function tryApi(q="Dessert"){
  try{
    const res = await fetch(`https://www.themealdb.com/api/json/v1/1/search.php?s=${q}`);
    const data = await res.json();
    if(data.meals && data.meals.length>0){
      let apiMeals = data.meals.map(m=>({...m,time:Math.floor(Math.random()*30+15),isCustom:false}));
      allMeals = [...customMeals, ...apiMeals];
      render(allMeals);
    }
  } catch(e){ console.log("API blocked, using backup"); }
}

document.getElementById('searchInput').addEventListener('input', ()=> render(allMeals));
document.getElementById('catSelect').addEventListener('change', ()=> render(allMeals));
document.getElementById('timeSelect').addEventListener('change', ()=> render(allMeals));

render(allMeals); // SHOW IMMEDIATELY
tryApi("Beef"); // TRY API IN BACKGROUND
</script>
</body>
</html>
