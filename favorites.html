<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Favorites</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif }
html, body { height:100%; overflow:hidden; }
body { background:#F5F5F5; display:flex; justify-content:center; align-items:center; }
.phone{ width:100%; max-width:380px; height:100vh; max-height:680px; background:white; display:flex; flex-direction:column; overflow:hidden; border-radius:20px; box-shadow:0 0 20px rgba(0,0,0,0.08); }
.top{ background:#FF9B2F; padding:16px; flex-shrink:0; border-radius:20px 20px 0 0; }
.top h2{font-size:18px;font-weight:900; display:flex; align-items:center; gap:6px}
.top p{font-size:11px;margin:2px 0 10px; opacity:0.9}
.content{ flex:1; overflow-y:auto; background:#FAFAFA; scrollbar-width:none; padding:12px}
.content::-webkit-scrollbar{display:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{border-radius:16px;overflow:hidden;background:white;box-shadow:0 1px 4px rgba(0,0,0,.08);border:1px solid #f0f0f0}
.thumb{position:relative} .thumb img{width:100%;height:125px;object-fit:cover;display:block}
.badge{position:absolute;top:7px;left:7px;background:#111;color:#FFC727;font-size:7px;font-weight:800;padding:3px 6px;border-radius:8px}
.heart{position:absolute;top:7px;right:7px;width:26px;height:26px;border-radius:50%;background:#FF4B3E;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:white}
.card h4{font-size:11px;font-weight:700;margin:7px 8px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;gap:4px;margin:0 8px 10px} .tags span{font-size:8px;padding:3px 6px;border-radius:10px;background:#F2F2F2} .tags .time{background:#FFF0B3}
.nav{display:flex;justify-content:space-around;align-items:center;padding:10px 0;background:white;border-top:1px solid #eee;flex-shrink:0}
.nav a{text-decoration:none;text-align:center;font-size:9px;color:#888;line-height:12px}
.nav a.active{color:#111;font-weight:700}
.nav .plus{width:38px;height:38px;background:#FFC727;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;color:#111;font-weight:900}
.empty{text-align:center;padding:50px 20px;color:#888;font-size:12px}
</style>
</head>
<body>
<div class="phone">
  <div class="top">
    <h2>Recipe Book 🔍</h2>
    <p id="count">What's cooking today? - 0 favorites</p>
  </div>

  <div class="content">
    <div style="font-size:14px;font-weight:800;margin-bottom:10px">❤️ My Favorites</div>
    <div class="grid" id="favGrid"></div>
    <div id="empty" class="empty" style="display:none">No favorites yet.<br>Go to Home and tap 🤍 to save</div>
  </div>

  <div class="nav">
    <a href="index.html">🏠<br>Home</a>
    <a href="favorites.html" class="active">⭐<br>Fav</a>
    <a href="add.html" class="plus">+</a>
    <a href="profile.html">👤<br>Prof</a>
    <a href="settings.html">⚙️<br>Set</a>
  </div>
</div>

<script>
let favs = JSON.parse(localStorage.getItem('recipe_favs') || '[]');
favs = favs.filter(m => m && m.strMeal && m.strMeal !== "undefined");
localStorage.setItem('recipe_favs', JSON.stringify(favs));

const grid = document.getElementById('favGrid');
const empty = document.getElementById('empty');
const count = document.getElementById('count');

count.innerText = favs.length > 0 ? `What's cooking today? - ${favs.length} favorites` : "What's cooking today?";

if(favs.length === 0){
  empty.style.display = "block";
} else {
  empty.style.display = "none";
  grid.innerHTML = favs.map(m=>`
    <div class="card">
      <div class="thumb">
        <img src="${m.strMealThumb}">
        ${m.isCustom?'<span class="badge">MY MEAL</span>':''}
        <button class="heart" onclick="removeFav('${m.idMeal}')">❤️</button>
      </div>
      <h4>${m.strMeal}</h4>
      <div class="tags"><span>${m.strCategory || 'Meal'}</span><span class="time">⏱ ${m.time || 20}m</span></div>
    </div>
  `).join('');
}

function removeFav(id){
  favs = favs.filter(f=>f.idMeal !== id);
  localStorage.setItem('recipe_favs', JSON.stringify(favs));
  location.reload();
}
</script>
</body>
</html>
